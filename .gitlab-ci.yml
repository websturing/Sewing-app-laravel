mirror_to_github:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache git
    - git config --global user.email "kaigrammm@gmail.com"
    - git config --global user.name "Mirror Bot"
  script:
    - git remote rm github || true
    - git remote add github https://${GITHUB_TOKEN}@github.com/websturing/Sewing-app-laravel.git
    - git fetch --all
    # Perubahan di sini: Menggunakan opsi -c untuk menonaktifkan kompresi
    - git -c protocol.postBuffer=100M push --mirror --no-thin --no-follow-tags github
  only:
    - branches
    - tags