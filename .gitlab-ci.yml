mirror_to_github:
  stage: deploy
  image: alpine:latest
  variables:
    GIT_STRATEGY: fetch
    GIT_FETCH_EXTRA_FLAGS: "--prune --tags --force --depth=0"
  before_script:
    - apk add --no-cache git
    - git config --global user.email "kaigrammm@gmail.com"
    - git config --global user.name "Mirror Bot"
  script:
    - git fetch origin --prune --tags --force --depth=0
    - git remote rm github || true
    - git remote add github https://${GITHUB_TOKEN}@github.com/websturing/Sewing-app-laravel.git
    - git push github --prune --all
    - git push github --prune --tags
  only:
    - branches
    - tags
